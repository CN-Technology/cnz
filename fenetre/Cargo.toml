[package]
name = "cnz-fenetre"
version = "1.0.0"
edition = "2021"
description = "CNZ : application graphique (glisser-déposer, compression, extraction)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "cnz-fenetre"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cnz = { path = ".." }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
# Native dialog boxes (Windows, macOS; Linux through xdg-desktop-portal, no GTK).
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
sys-locale = "0.3"
zeroize = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1

